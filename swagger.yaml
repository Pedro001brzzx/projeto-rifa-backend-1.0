  Compra:
    type: "object"
    properties:
      id:
        type: "string"
      campanha:
        type: "object"
      quantidade_titulos:
        type: "integer"
      valor_total:
        type: "number"
      status_pagamento:
        type: "string"
        enum: ["pendente", "aprovado", "cancelado", "recusado", "expirado"]
      metodo_pagamento:
        type: "string"
      criado_em:
        type: "string"
        format: "date-time"
      titulos:
        type: "array"
        items:
          type: "object"
          properties:
            id:
              type: "integer"
            numero:
              type: "string"
            is_ganhador:
              type: "boolean"

  Ganhador:
    type: "object"
    properties:
      id:
        type: "string"
        format: "uuid"
        description: "public_id da campanha"
      name:
        type: "string"
        example: "Pedro ***"
      campaignTitle:
        type: "string"
      prize:
        type: "string"
      luckyNumber:
        type: "string"
      drawDate:
        type: "string"
        example: "15/03/2026"
      phone:
        type: "string"
        example: "(**) *****-1234"

  Comunicado:
    type: "object"
    properties:
      id:
        type: "integer"
      titulo:
        type: "string"
      conteudo:
        type: "string"
      tipo:
        type: "string"
        enum: ["informativo", "alerta", "aviso"]
      ativo:
        type: "boolean"
      criado_em:
        type: "string"
        format: "date-time"

  Comprador:
    type: "object"
    properties:
      compra_id:
        type: "integer"
      titulo_id:
        type: "integer"
      usuario_id:
        type: "integer"
      nome:
        type: "string"
      telefone:
        type: "string"
      numero_titulo:
        type: "string"
      data_compra:
        type: "string"
        format: "date-time"

  AdminLog:
    type: "object"
    description: "Entrada de log de ação administrativa"
    properties:
      id:
        type: "integer"
      admin_name:
        type: "string"
        description: "Nome do administrador que executou a ação"
      action:
        type: "string"
        example: "Definição de Ganhador"
      details:
        type: "string"
        description: "Detalhes adicionais em texto livre"
      ip_address:
        type: "string"
        example: "192.168.0.1"
      created_at:
        type: "string"
        format: "date-time"
